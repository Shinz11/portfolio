<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo | Shinji Okazaki</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
            color: #f5f5f5;
            background: #000;
            line-height: 1.8;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 72px 24px 64px;
        }

        header {
            margin-bottom: 64px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 32px;
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        a {
            color: #f5f5f5;
            font-weight: 600;
            text-decoration: underline;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .lead {
            margin: 0;
            color: #aaa;
            font-size: 0.9rem;
        }

        section {
            margin-top: 56px;
        }

        h2 {
            margin: 0 0 24px;
            color: #aaa;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 0;
            overflow: hidden;
        }

        .video-wrapper iframe,
        .video-wrapper video {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .video-placeholder {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ccc;
            font-size: 0.95rem;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .note {
            margin-top: 16px;
            color: #f5f5f5;
            font-size: 0.95rem;
        }

        ul {
            margin: 0;
            padding-left: 1.2em;
            color: #f5f5f5;
        }

        footer {
            margin-top: 72px;
            color: #333;
            font-size: 0.8rem;
            text-align: left;
        }

        @media (max-width: 600px) {
            .container {
                padding: 48px 20px 56px;
            }

            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a class="back-link" href="index.html">← Back to Home</a>
            <h1>Demo Movie</h1>
            <p class="lead">
                微分音入力対応ピアノロールシステムの紹介動画
            </p>
        </header>

        <section id="movie">
            <h2>Movie</h2>
            <div class="video-wrapper">
                <div class="video-placeholder">
                    準備中
                </div>

                <!-- YouTube等を使う場合の例：
                <iframe
                    src="https://www.youtube.com/embed/VIDEO_ID"
                    title="Demo Movie"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
                -->

                <!-- mp4ファイルを直接置く場合の例：
                <video controls>
                    <source src="demo.mp4" type="video/mp4">
                    お使いのブラウザは動画タグに対応していません。
                </video>
                -->
            </div>
            <p class="note">
                本動画では，微分音入力対応ピアノロールによる音高調整と音階構築の流れを紹介します．
            </p>
        </section>

        <section id="overview">
            <h2>Overview</h2>
            <p>
                本システムは，ユーザが自身の聴覚に基づいて音高を調整し，主観的な音階を<br>構築するための微分音入力対応ピアノロールです．
            </p>
            <ul>
                <li>微細な音高調整</li>
                <li>12平均律に依存しない設計</li>
                
                
            </ul>
        </section>

        <footer>
            © Shinji Okazaki
        </footer>
    </div>
</body>
</html>
