<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo | Shinji Okazaki</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            font-size: 1.25rem;
            line-height: 1.8;

            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 850px;
            width: 90%;
            padding: 120px 0;
        }

        header {
            margin-bottom: 100px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 500;
            letter-spacing: 0.1rem;
            margin: 0;
        }

        .lead {
            color: #888;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        section {
            margin-bottom: 80px;
            margin-top: 0;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #aaa;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 0.15rem;
        }

        p,
        .note,
        li {
            font-size: 1.25rem;
            color: #ddd;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #111;
            overflow: hidden;
        }

        .video-wrapper iframe,
        .video-wrapper video {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .video-placeholder {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 1.25rem;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 32px;
            color: #888;
        }

        a {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
            border-bottom: 1px solid #333;
        }

        a:hover {
            color: #aaa;
            border-bottom: 1px solid #aaa;
        }

        footer {
            margin-top: 150px;
            font-size: 0.9rem;
            color: #444;
            letter-spacing: 0.05rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a class="back-link" href="index.html">← Back to Home</a>
            <h1>Demo Movie</h1>
            <p class="lead">
                微分音入力対応ピアノロールシステムの紹介動画
            </p>
        </header>

        <section id="movie">
            <h2>Movie</h2>
            <div class="video-wrapper">
                

                <iframe
                    src="https://www.youtube.com/embed/FLpDwZYIbQk"
                    title="Demo Movie"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
                

                <!-- mp4ファイルを直接置く場合の例：
                <video controls>
                    <source src="demo.mp4" type="video/mp4">
                    お使いのブラウザは動画タグに対応していません。
                </video>
                -->
            </div>
            <p class="note">
                本動画では，微分音入力対応ピアノロールによる音高調整と音階構築の流れを紹介します．
            </p>
        </section>

        <section id="overview">
            <h2>Overview</h2>
            <p>
                本システムは，ユーザが自身の聴覚に基づいて音高を調整し，主観的な音階を<br>構築するための微分音入力対応ピアノロールです．
            </p>
            <ul>
                <li>微細な音高調整</li>
                <li>12平均律に依存しない設計</li>
                
                
            </ul>
        </section>

        <footer>
            © Shinji Okazaki
        </footer>
    </div>
</body>
</html>
